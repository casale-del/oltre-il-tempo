
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oltre il tempo</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  background: #07142e;
  font-family: Arial, sans-serif;
}
#intro {
  position: absolute;
  top: 12px;
  width: 100%;
  text-align: center;
  color: white;
  z-index: 2;
  pointer-events: none;
}
h1 { font-size: 23px; letter-spacing: 2px; }
p { font-size: 14px; }
#start {
  position: absolute;
  z-index: 5;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  padding: 17px 26px;
  border: none;
  border-radius: 14px;
  background: #f5d36b;
  color: #17213a;
  font-size: 18px;
  font-weight: bold;
}
a-scene { width: 100vw; height: 100vh; }
</style>
</head>

<body>

<div id="intro">
  <h1>OLTRE IL TEMPO</h1>
  <p>Inquadra la stella e scopri la sorpresa</p>
</div>

<button id="start">✨ INIZIA</button>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: true;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="stella"
      src="./58C37DCC-3D5E-460F-B086-6D917EDACD16.png">
  </a-assets>

  <a-camera position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-entity
      position="0 0 0.15"
      animation="property: position; to: 0 0 0.55; dur: 2200; easing: easeOutCubic">

      <a-image
        src="#stella"
        width="1.5"
        height="1.2"
        transparent="true"
        material="shader: flat; transparent: true; side: double"
        animation="property: rotation; to: 0 0 360; dur: 22000; easing: linear; loop: true">
      </a-image>

      <a-sphere position="0.65 0.5 0.12"
        radius="0.018" color="#fff4bd"
        material="emissive: #fff4bd"
        animation="property: scale; to: 2 2 2; dir: alternate; dur: 700; loop: true">
      </a-sphere>

      <a-sphere position="-0.62 0.35 0.1"
        radius="0.025" color="#ffdf80"
        material="emissive: #ffdf80"
        animation="property: scale; to: 1.8 1.8 1.8; dir: alternate; dur: 900; loop: true">
      </a-sphere>

      <a-sphere position="0.55 -0.5 0.1"
        radius="0.018" color="#fff4bd"
        material="emissive: #fff4bd"
        animation="property: scale; to: 2 2 2; dir: alternate; dur: 1100; loop: true">
      </a-sphere>

      <a-sphere position="-0.55 -0.55 0.1"
        radius="0.022" color="#ffdf80"
        material="emissive: #ffdf80"
        animation="property: scale; to: 2 2 2; dir: alternate; dur: 800; loop: true">
      </a-sphere>

      <a-sphere position="0.05 0.72 0.1"
        radius="0.015" color="#ffffff"
        material="emissive: #ffffff"
        animation="property: scale; to: 2 2 2; dir: alternate; dur: 650; loop: true">
      </a-sphere>

    </a-entity>
  </a-entity>

</a-scene>

<script>
const button = document.querySelector("#start");

button.addEventListener("click", async () => {
  button.style.display = "none";
  const scene = document.querySelector("a-scene");
  await scene.systems["mindar-image-system"].start();
});
</script>

</body>
</html>
